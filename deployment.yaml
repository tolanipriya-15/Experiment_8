
apiVersion: apps/v1
kind: Deployment
metadata:
  name: priya-web-app
  labels:
    app: priya-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: priya-web
  template:
    metadata:
      labels:
        app: priya-web
    spec:
      containers:
        - name: web-container
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
